[package]
name = "hexmeow-motor-iap"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "Strict, identity-gated COBS firmware update protocol over Classic CAN"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hex-meow/hexmeow-motor-iap"
readme = "README.md"
keywords = ["can", "canopen", "firmware", "dfu", "iap"]
categories = ["embedded", "hardware-support"]

[dependencies]
can-transport = { version = "0.1.4", default-features = false }
crc = "3"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
async-trait = "0.1"
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
